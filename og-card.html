<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>ChessToScroll share image</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
    body { display: block; min-height: 0; background: #0e0c0a; }
    .card {
      width: 1200px;
      height: 630px;
      padding: 72px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        radial-gradient(ellipse at 88% 18%, rgba(255, 176, 32, 0.2), transparent 46%),
        linear-gradient(rgba(247, 244, 239, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(247, 244, 239, 0.04) 1px, transparent 1px),
        #0e0c0a;
      background-size: auto, 56px 56px, 56px 56px, auto;
      border-top: 10px solid #ffb020;
    }
    .brand { display: flex; align-items: center; gap: 16px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
    .brand img { width: 84px; height: 84px; object-fit: contain; }
    h1 { font-size: 68px; max-width: 14ch; margin: 0; line-height: 1.05; }
    .sub { font-size: 28px; font-style: italic; font-weight: 500; margin: 0; }
    .foot { font-size: 22px; color: #c4bdb2; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="logo.png" alt=""> ChessToScroll</div>
    <h1>Solve a chess puzzle before you scroll.</h1>
    <p class="sub">Play a chess puzzle to earn screen time.</p>
    <p class="foot">Android on Google Play · iOS on the way</p>
  </div>
</body>
</html>
